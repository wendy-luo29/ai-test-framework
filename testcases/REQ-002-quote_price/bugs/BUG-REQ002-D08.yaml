expected:
  ac: "AC-32"
  rule: "需求 C-04：未知仓库按计费失败处理（返回统一失败契约 + 落 status=300 任务行 + job_log 原因）"
  actual_vs_expected: "实测 code=\"200\"、返回 1 行报价（Aramex 5.724），落库 status=200"

related_cases:
  - case_id: "TC-QPS-014"
