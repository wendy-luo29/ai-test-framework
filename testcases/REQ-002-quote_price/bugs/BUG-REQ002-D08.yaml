bug_id: BUG-REQ002-D08
title: "未知仓库 WH-NOT-EXIST-0000 未按计费失败处理，仍返回成功报价"
severity: 中
priority: P2
requirement: "REQ-002 承运商运费计算同步（/quote/price_sync）"
status: 新建
discovered_version: "dev 环境当前版本（2026-11-23 实测，2026-11-24 回归仍在）"
reporter: "wendy"
