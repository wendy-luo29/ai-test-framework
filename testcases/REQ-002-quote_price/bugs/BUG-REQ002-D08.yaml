    ac: "AC-32"
    priority: P2
    source: "tests/api/test_quote_price_sync.py"

analysis:
  phenomenon: "lsp_warehouse 不存在的仓库编码仍完成计费并返回成功"
  direct_cause: "仓库主数据查询失败后未走计费失败分支，走了默认/兜底计价逻辑"
  root_cause: "发运仓主数据校验缺失：未按仓库 from_facility 解析 zone 的失败场景兜底为计费失败，而是跳过仓库维度直接出价"
  evidence: "REQ-002-defects.md D-08（2026-11-23 实测，requestId=SAC17954331295155049 落库 status=200）；2026-11-24 回归 xfail 证实仍在（reports/junit_quote_price_sync.xml）"
  pending: "无"

impact:
  scope: "仓库主数据错误的请求可拿到看似合法的报价，落库任务状态失真（status=200），计费口径不可信"
  frequency: "稳定复现"

suggestion:
  fix: "warehouseCode 实查 lsp_warehouse 失败时按计费失败处理：返回统一失败契约并落 status=300 + job_log 记录原因"
  regression: "TC-QPS-014 全量回归"
