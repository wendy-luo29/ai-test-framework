          - packageCode: "QTP20261123008"
            length: 30
            width: 20
            height: 15
            weight: 2
            items:
              - sku: "SKU-001"
                qty: 1
                length: 30
                width: 20
                height: 15
                weight: 2
    isPushWms: 200
    pushResultTo: 200
    closePoboxCheck: 200
  headers:
