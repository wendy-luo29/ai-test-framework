bug_id: BUG-REQ002-D05
title: "非法策略编码（VIR|、不存在的策略）请求超时不返回，任务停留 status=100"
severity: 中
priority: P2
requirement: "REQ-002 承运商运费计算同步（/quote/price_sync）"
status: 新建
discovered_version: "dev 环境当前版本（2026-11-23 实测，2026-11-24 回归仍在）"
reporter: "wendy"
reported_at: "2026-11-24"

environment:
  name: dev
  base_url: "http://192.168.1.71:13100"

api:
  method: POST
  path: "/quote/price_sync"

request:
  body:
    requestId: "SAC17954331872027909"
    orderCode: "TESTSO20261123005"
    ownerId: "BG"
    carrierStrategyCode: "NO_SUCH_STRATEGY"
    shipTo:
      country: "AU"
      state: "NSW"
      suburb: "Haymarket"
      postcode: "2000"
      address1: "456 George Street"
      address2: ""
    warehouse:
      - warehouseCode: "BG03"
        shipmentCode: "TS20261123005"
        packages:
          - packageCode: "QTP20261123005"
            length: 30
            width: 20
            height: 15
            weight: 1.15
            items:
              - sku: "SKU-001"
                qty: 1
                length: 30
                width: 20
                height: 15
                weight: 1.15
    isPushWms: 200
    pushResultTo: 200
    closePoboxCheck: 200
  headers:
    Content-Type: "application/json"

response:
  status: "无响应（>30s 客户端 ReadTimeout）"
  body:
    error: "requests.exceptions.ReadTimeout"
    lsp_quote_task:
      request_id: "SAC17954331872027909"
      status: 100

expected:
  ac: "AC-40"
  rule: "需求 AC-40/§9.3：策略编码不存在应失败快速返回 code=\"500\" + msg 非空，并落 status=300 任务行"
  actual_vs_expected: "实测 >30s 未返回（ReadTimeout），lsp_quote_task 停留 status=100（进行中）"

related_cases:
  - case_id: "TC-QPS-022"
    title: "功能-比价：VIR 段非法（VIR|）（参数化 vir-malformed 条目，xfail）"
    ac: "AC-40"
    priority: P2
    source: "tests/api/test_quote_price_sync.py"
  - case_id: "TC-QPS-022"
    title: "功能-比价：策略编码不存在（NO_SUCH_STRATEGY）（参数化 strategy-not-exist 条目，xfail）"
    ac: "AC-40"
    priority: P2
    source: "tests/api/test_quote_price_sync.py"

analysis:
  phenomenon: "非法策略编码请求挂起超时，任务行停留进行中状态"
  direct_cause: "策略解析分支对不存在的策略编码未走失败出口，疑似进入重试/轮询等待"
  root_cause: "策略编码校验前置缺失：lsp_carrier_strategy 查不到对应记录时未立即返回失败，导致线程阻塞至客户端超时"
  evidence: "REQ-002-defects.md D-05（2026-11-23 实测，requestId=SAC17954331872027909）；2026-11-24 回归 2 条参数化用例 xfail 证实仍在（reports/junit_quote_price_sync.xml）"
  pending: "「策略绑定空集合」分支 2026-11-24 回归已符合预期（返回 code=\"500\"+msg=\"No available carrier\" 并落 status=300，用例 xpass），疑似部分修复；待开发确认修复范围后收敛本单"

impact:
  scope: "调用方线程被挂起 30s+；任务行永久停留 status=100，无失败原因记录"
  frequency: "稳定复现"

suggestion:
  fix: "策略编码解析前置校验：VIR 格式非法或 lsp_carrier_strategy 无记录时立即返回统一失败契约并落 status=300"
  regression: "TC-QPS-022 全量回归 + TC-QPS-024/027（同用 eiz 策略）"
