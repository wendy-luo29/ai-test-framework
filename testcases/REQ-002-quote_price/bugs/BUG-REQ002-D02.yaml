bug_id: BUG-REQ002-D02
title: "包裹层尺寸部分为 0 仍成功计费（需求要求拒绝）"
severity: 中
priority: P2
requirement: "REQ-002 承运商运费计算同步（/quote/price_sync）"
status: 新建
discovered_version: "dev 环境当前版本（2026-11-23 实测，2026-11-24 回归仍在）"
reporter: "wendy"
reported_at: "2026-11-24"

environment:
  name: dev
  base_url: "http://192.168.1.71:13100"

api:
  method: POST
  path: "/quote/price_sync"

request:
  body:
    requestId: "SAC17954331872020002"
    orderCode: "TESTSO20261123002"
    ownerId: "BG"
    carrierStrategyCode: "VIR|CAR2025062611067266788"
    shipTo:
      country: "AU"
      state: "NSW"
      suburb: "Haymarket"
      postcode: "2000"
      address1: "456 George Street"
      address2: ""
    warehouse:
      - warehouseCode: "BG03"
        shipmentCode: "TS20261123002"
        packages:
          - packageCode: "QTP20261123002"
            length: 30
            width: 0
            height: 15
            weight: 3
            items:
              - sku: "SKU-001"
                qty: 1
                length: 30
                width: 0
                height: 15
                weight: 3
    isPushWms: 200
    pushResultTo: 200
    closePoboxCheck: 200
  headers:
    Content-Type: "application/json"

response:
  status: "HTTP 200"
  body:
    code: "200"
    msg: "success"
    success: true
    data:
      - shippingCost: 30.018
        bookingCarrierId: "CAR2025062611067266788"

expected:
  ac: "AC-36"
  rule: "需求 AC-36：包裹层尺寸/重量部分为 0 应被拒绝（失败返回 + 不落任务行）"
  actual_vs_expected: "width=0 请求成功返回报价（data 1 行），未拒绝"

related_cases:
  - case_id: "TC-QPS-021"
