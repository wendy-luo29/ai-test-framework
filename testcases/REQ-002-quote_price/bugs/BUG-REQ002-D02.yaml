    priority: P2
    source: "tests/api/test_quote_price_sync.py"

analysis:
  phenomenon: "packages[0].width=0 仍返回成功报价"
  direct_cause: "包裹尺寸校验只拦截全 0/缺失，未把部分为 0 判为非法值"
  root_cause: "箱规计算将 0 当作合法输入参与体积/计费流程，缺少\"尺寸必须为正数\"的逐项校验"
  evidence: "REQ-002-defects.md D-02（2026-11-23 实测）；2026-11-24 回归 xfail 证实仍在（reports/junit_quote_price_sync.xml）"
  pending: "无"

impact:
  scope: "非法包裹数据可进入计费并产生错误报价，可能误导下单决策"
  frequency: "稳定复现"

suggestion:
  fix: "包裹层与 SKU 层尺寸/重量增加逐项正数校验，任一为 0 按参数校验失败统一拒绝"
  regression: "TC-QPS-021 全量回归"
