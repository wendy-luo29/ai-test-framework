requirement: REQ-001
ac_list:
- AC-01
- AC-02
- AC-03
cases:
- case_id: TC-ADDR-001
  ac: AC-01
  title: 主键组合命中地址表时普通地址校验通过
  priority: P0
  precondition: 地址校验服务已部署且可访问；config/env.yaml 中 api_base_url 指向被测环境；数据库连接正常；执行前已用 SQL 确认地址表中存在约定的 state+postcode+suburb 记录。
  data: '{"address":"123 George Street","address2":"","state":"NSW","postcode":"2000","suburb":"Sydney","country":"Australia"}'
  steps: '1. 按【测试数据】构造 application/json 请求体；

    2. POST {api_base_url}/address/validate；

    3. 校验 HTTP 状态码、响应包装结构、业务字段与 isPoBox。'
  expected: HTTP 200；success=true；data.success=true；data.isPoBox=false；data.countryCode="AU"；data.stateCode="NSW"；data.postcode="2000"；data.suburb="Sydney"。【DB
    校验】若 success=true：使用 state 归一化后的简称（响应 data.stateCode）、data.postcode、data.suburb 查询 lsp_address_suburb_postcode，应存在满足 state_code
    = data.stateCode AND postcode = data.postcode AND UPPER(suburb_name) = UPPER(data.suburb) 的记录（suburb 大小写不敏感）。
  assertions: '① status == 200；

    ② 顶层含 code/data/hasMore/msg/success/tc/tp，类型正确；

    ③ data.success is True；data.isPoBox is False；data.stateCode == "NSW"；data.postcode == "2000"；data.suburb == "Sydney"。

    【DB】若 success=true：执行 SELECT 1 FROM lsp_address_suburb_postcode WHERE state_code = <data.stateCode> AND postcode = <data.postcode>
    AND UPPER(suburb_name) = UPPER(<data.suburb>) LIMIT 1，结果必须存在。'
  automatable: 是
  assertion_method: 接口返回（requests + pytest） + 数据库查询（db fixture：校验 lsp_address_suburb_postcode 中存在 state_code=data.stateCode、postcode=data.postcode、UPPER(suburb_name)=UPPER(data.suburb)
    的记录）
  risk: stateCode/suburbCode 的取值来源与大小写需确认【待确认】。
  module: 地址校验
- case_id: TC-ADDR-002
  ac: AC-02
  title: suburb 不在地址表时返回 address not found
  priority: P0
  precondition: 地址校验服务已部署且可访问；config/env.yaml 中 api_base_url 指向被测环境；数据库连接正常；执行前已用 SQL 确认地址表中存在约定的 state+postcode+suburb 记录。
  data: '{"address":"123 George Street","state":"NSW","postcode":"2000","suburb":"NotARealSuburb","country":"Australia"}'
  steps: '1. 按【测试数据】构造 application/json 请求体；

    2. POST {api_base_url}/address/validate；

    3. 校验 HTTP 状态码、响应包装结构、业务字段与 isPoBox。'
  expected: HTTP 200；success=false；data.reason == "address not found"；不返回 5xx。
  assertions: '① status == 200；

    ② 顶层包装结构完整；

    ③ data.success is False；data.reason == "address not found"。'
  automatable: 是
  assertion_method: 接口返回（requests + pytest）
  risk: 已确认：不存在固定返回 success=false + reason=address not found。
  module: 地址校验
- case_id: TC-ADDR-003
  ac: AC-03
  title: 非澳大利亚国家提交时返回校验失败
  priority: P1
  precondition: 地址校验服务已部署且可访问；config/env.yaml 中 api_base_url 指向被测环境；数据库连接正常；执行前已用 SQL 确认地址表中存在约定的 state+postcode+suburb 记录。
  data: '{"address":"123 George Street","state":"NSW","postcode":"2000","suburb":"Sydney","country":"ZZ"}'
  steps: '1. 按【测试数据】构造 application/json 请求体；

    2. POST {api_base_url}/address/validate；

    3. 校验 HTTP 状态码、响应包装结构、业务字段与 isPoBox。'
  expected: success=false；reason/msg 提示国家不支持；不得 5xx。
  assertions: '① 非 5xx；② data.success is False；③ reason/msg 非空且含国家/不支持语义；

    ④ 即使主键存在也不得 success=true。'
  automatable: 是
  assertion_method: 接口返回（requests + pytest）
  risk: 国家校验与存在性校验的先后顺序未确认【待确认】。
  module: 地址校验
