[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    # ── 执行范围 ──
    smoke:        fast subset covering critical paths
    regression:   full regression suite

    # ── 测试层级 ──
    api:          API-layer tests
    db:           tests that assert against the MySQL database
    ui:           browser-driven UI tests

    # ── 模块维度 ──
    module_lsp_backend:    LspBackend 基础信息配置（地址校验、策略配置）
    module_lsp_quote:      LspQuote 物流计费/报价
    module_lsp_booking:    LspBooking 物流申报/下单

    # ── 承运商维度 ──
    carrier_all:   所有承运商通用
    carrier_a:     承运商 A
    carrier_b:     承运商 B

    # ── 版本维度 ──
    version_v1:    Version 1.x
    version_v2:    Version 2.x

    # ── 功能粒度（可选，按需要加） ──
    feature_address_validation:  地址校验
    feature_pricing:             计费/报价
    feature_declare:             申报/下单
