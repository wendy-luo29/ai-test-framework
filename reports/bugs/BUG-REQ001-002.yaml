bug_id: BUG-REQ001-002
title: "state 为空字符串时 reason 返回 address not found，而非字段级 state not found"
status: 新建
severity: S3
priority: P2
requirement: REQ-001
discovered_version: "commit f5ce1ec / master"
reporter: 自动化测试
reported_at: "2026-11-17 16:20"
reproduce_command: 'python -m pytest "tests/api/test_address_validate.py::test_null_or_empty_key_fields" -q'
environment:
  name: 测试
  base_url: "http://192.168.1.71:13109"
  deploy_version: "未提供"
api:
  method: POST
  path: /address/validate
request:
  headers:
    Content-Type: application/json
  body:
    address: "123 George Street"
    address2: ""
    country: "Australia"
    is_return: false
    order_id: "ORD-ADDR-0001"
    postcode: "2000"
    state: ""
    suburb: "Sydney"
response:
  status: 200
  elapsed: "未记录"
  body:
    data:
      orderId: "ORD-ADDR-0001"
      success: false
      reason: address not found
      country: Australia
      countryCode: null
      state: ""
      stateCode: null
      suburb: Sydney
      suburbCode: null
      postcode: "2000"
      address: null
      address2: null
      fullAddress: null
      isPoBox: false
      adviceAddress: null
    code: "200"
    msg: ""
    tc: 0
    tp: 0
    hasMore: 0
    success: true
  request_id: "未获取"
  log: "未获取"
expected:
  ac: "AC-02 / AC-07（主键完整性）"
  rule: "state 为空字符串时应返回业务失败，reason 指出具体缺失字段（state not found），便于调用方区分“字段缺失”与“地址不存在”。"
  actual_vs_expected: "预期 data.success=false 且 reason 含 state not found；实际 data.success=false，reason=address not found，stateCode=null。"
related_cases:
  - case_id: TC-ADDR-009
    title: 主键字段为 null 或空字符串时返回参数校验错误
    ac: AC-02
    priority: P1
    source: .claude/skills/design-testcases/output/REQ-001-TC-design-v2.md
attachments:
  - reports/REQ-001-test-report-20261117.md
  - reports/report.html
  - reports/junit.xml
analysis:
  phenomenon: "state=\"\" 时接口返回 HTTP 200，wrapper.success=true，data.success=false，data.reason=address not found。"
  direct_cause: "空字符串 state 未在入参校验阶段被识别为缺失字段，直接进入地址表查询，查无结果后统一返回 address not found。"
  root_cause: "实现把“字段为空串”与“地址不存在”归为同一失败分支，未按字段单独生成 reason，导致失败原因不可区分。"
  evidence: "断言结果：reason 应为 'state not found'，实际 'address not found'；同一用例中 state=null 时同样返回 address not found。"
  pending: "需产品/开发确认失败原因粒度：是否需要字段级 reason（state/postcode/suburb not found），或统一使用 address not found。"
impact:
  scope: "state、postcode、suburb 传空字符串的地址校验请求"
  frequency: "稳定复现（本次执行 1/1 失败）"
  related: "错误码与文案规范、前端错误提示、调用方重试与埋点统计"
suggestion:
  fix: "在入参校验阶段对空串做缺失字段判定，返回字段级 reason（如 state not found）；若确认统一文案可接受，则同步修改 TC-ADDR-009 的期望值。"
  regression: "TC-ADDR-009、TC-ADDR-027、TC-ADDR-028"
