bug_id: BUG-REQ001-001
title: "state/postcode/suburb 为 null 或空串时返回 address not found，而非参数校验错误"
status: 新建
severity: S3
priority: P2
requirement: REQ-001
discovered_version: "commit f5ce1ec / master"
reporter: 自动化测试
reported_at: "2026-11-17 15:43"
reproduce_command: 'python -m pytest "tests/api/test_address_validate.py::test_null_or_empty_key_fields" -q'
environment:
  name: 测试
  base_url: "http://192.168.1.71:13109"
  deploy_version: "未提供"
api:
  method: POST
  path: /address/validate
request:
  headers:
    Content-Type: application/json
  body:
    address: "123 George Street"
    country: "Australia"
    postcode: "2000"
    suburb: "Sydney"
    state: null
response:
  status: 200
  elapsed: "未记录"
  body:
    data:
      orderId: null
      success: false
      reason: address not found
      country: Australia
      countryCode: null
      state: ""
      stateCode: null
      suburb: Sydney
      suburbCode: null
      postcode: "2000"
      address: null
      address2: null
      fullAddress: null
      isPoBox: false
      adviceAddress: null
    code: "200"
    msg: ""
    tc: 0
    tp: 0
    hasMore: 0
    success: true
  request_id: "未获取"
  log: "未获取"
expected:
  ac: "AC-02 / AC-07（主键完整性）"
  rule: "state、postcode、suburb 均为必填主键；任一缺失、为 null 或为空字符串时应拒绝请求，并返回参数校验错误（code=400、data=null、msg 指出缺失字段）。"
  actual_vs_expected: "预期 code=400 / data=null / msg 指出缺失字段；实际 code=200 / data.success=false / reason=address not found / data 为对象。"
related_cases:
  - case_id: TC-ADDR-009
    title: 主键字段为 null 或空字符串时返回参数校验错误
    ac: AC-02
    priority: P1
    source: .claude/skills/design-testcases/output/REQ-001-TC-design-v2.md
  - case_id: TC-ADDR-027
    title: state/postcode/suburb 任一缺失时返回参数校验错误
    ac: AC-07
    priority: P0
    source: .claude/skills/design-testcases/output/REQ-001-TC-design-v2.md
attachments:
  - reports/REQ-001-test-report-20261117-1543.md
  - reports/junit.xml
analysis:
  phenomenon: "state=null 时接口返回 HTTP 200，wrapper.success=true，data.success=false，data.reason=address not found。"
  direct_cause: "实现把“字段存在但为 null/空串”当作地址表查无匹配，直接返回 address not found。"
  root_cause: "设计文档 v2.2 要求 null/空串走参数校验错误；实现只在字段缺失时走参数校验错误。两种语义不一致，导致错误码与提示不同。"
  evidence: "实际响应 data.state=\"\"、data.reason=\"address not found\"；对照 TC-ADDR-027 在字段缺失时返回 code=400、data=null、msg=\"Validate failed, [state]: 缺少省份\"。"
  pending: "需产品确认：state/postcode/suburb 为 null/空串时应返回参数校验错误，还是按地址不存在处理。"
impact:
  scope: "state、postcode、suburb 任一为 null 或空字符串的地址校验请求"
  frequency: "稳定复现（本次全量执行 1/1，历史执行同样失败）"
  related: "地址校验错误分类、前端错误提示、调用方重试策略"
suggestion:
  fix: "若确认应为参数校验错误：补 null/空串校验分支，返回 code=400、data=null、msg 指出缺失字段；若确认 address not found 可接受：更新 TC-ADDR-009 与设计文档 v2.2。"
  regression: "TC-ADDR-009、TC-ADDR-027、TC-ADDR-028"
