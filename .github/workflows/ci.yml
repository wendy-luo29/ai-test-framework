name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 说明：
# 托管 runner 无法访问内网被测环境（192.168.x.x），因此 CI 只做"能离线验证"的部分：
#   1. 知识库一致性（严格模式，任何告警都阻断）
#   2. 用例可收集（导入错误、marker 未注册会在这里暴露）
#   3. 离线 demo 冒烟（验证 pytest + Playwright 链路本身可用）
# 真实 API/UI 回归请在能访问被测环境的自建 runner 上执行：
#   python -m pytest tests -m "api or (ui and not smoke)" --junitxml=reports/junit.xml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Validate knowledge base (strict)
        run: python scripts/knowledge_guard.py --strict

      - name: Verify test collection
        run: python -m pytest --collect-only -q

      - name: Run offline smoke
        run: |
          mkdir -p reports
          python -m pytest tests/ui/test_example_home.py -v \
            --junitxml=reports/junit.xml \
            --html=reports/report.html --self-contained-html

      - name: Enforce effective execution
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("reports/junit.xml").getroot().iter("testcase"))
          executed = [
              c for c in cases
              if c.find("failure") is None and c.find("error") is None and c.find("skipped") is None
          ]
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"total={len(cases)} executed={len(executed)} skipped={len(skipped)}")
          if not executed:
              print("::error::没有任何实际执行的用例，全部 skip 不算通过")
              sys.exit(1)
          PY

      - name: Export Excel report
        if: always()
        env:
          TEST_ENV: "GitHub Actions"
        run: python scripts/export_test_report.py --no-writeback

      - name: Upload test report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/junit.xml
            reports/report.html
            reports/test-results_*.xlsx
