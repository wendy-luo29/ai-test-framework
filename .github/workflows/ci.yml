name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 这里保留了你刚加的手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 新增步骤：启动一个假的本地服务器供测试使用
      - name: Start local mock server
        run: |
          python -m http.server 8000 &
          sleep 2

      # 运行测试并生成 junit + html 报告（失败也继续后续发送步骤）
      - name: Run tests
        env:
          CI_API_URL: "http://127.0.0.1:8000" # 告诉测试代码用本地回环地址
        run: |
          mkdir -p reports
          python -m pytest tests -v \
            --junitxml=reports/junit.xml \
            --html=reports/report.html --self-contained-html

      - name: Upload test report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/junit.xml
            reports/report.html

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          TEST_ENV: "GitHub Actions"
        run: python scripts/send_report.py