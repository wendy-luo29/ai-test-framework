# 测试影响索引
# 机读 YAML，Skill 和脚本直接解析判断回归范围。
# 格式约定：每个 change 条目唯一 ID + 变更单元 + 回归目标用例清单。
#
# 维护规则：
# 1. 每次规则/API/DB 变更 → 新增 change 条目（不是覆盖旧的）
# 2. regression_targets 用 case_id（如 TC-ADDR-001），不用自然语言描述
# 3. 历史条目保留，标记 status: superseded 即可
# 4. Skill 在执行时读 changes[].regression_targets 来决定跑哪些用例
# 5. 新增/变更条目后运行 python scripts/knowledge_guard.py 校验

changes:
  # ───────────────────────────────────────────────────────
  # CHG-001: 地址校验 v2.1 规则全面确认
  # ───────────────────────────────────────────────────────
  - id: CHG-001
    module: lsp_backend
    feature: address_validation
    field: country (default + validation)
    date: "2026-11-15"
    type: rule_change
    description: |
      country 字段接受 AU/Australia（大小写不敏感），
      默认值 Australia，非 AU 拒绝。
    affected_carriers: [all]
    regression_targets:
      - TC-ADDR-003   # test_non_australia_country_rejected
      - TC-ADDR-011   # test_country_variants
      - TC-ADDR-012   # test_country_empty_or_null (目前 skip，等确认)
    gotchas: [gotcha_001, gotcha_002]
    knowledge_docs:
      - knowledge/rules/lsp_backend/address_validation.md
      - knowledge/changelog/2026-11-15_address_v2_1.md
    status: active

  - id: CHG-001b
    module: lsp_backend
    feature: address_validation
    field: not_found_response
    date: "2026-11-15"
    type: rule_change
    description: |
      not-found 场景走 HTTP 200 + data.success=false，
      不是 HTTP 404。reason="address not found"。
    affected_carriers: [all]
    regression_targets:
      - TC-ADDR-008   # test_key_case_and_whitespace
      - TC-ADDR-009   # test_null_or_empty_key_fields
      - TC-ADDR-025   # test_not_found_short_circuits_pobox
      - TC-ADDR-029   # test_suburb_special_or_long
    gotchas: [gotcha_002]
    knowledge_docs:
      - knowledge/rules/lsp_backend/address_validation.md
    status: active

  - id: CHG-001c
    module: lsp_backend
    feature: address_validation
    field: state_normalization + suburb_case_insensitive_query
    date: "2026-11-15"
    type: rule_change
    description: |
      state 全名自动标准化为缩写；
      DB 查询 suburb 大小写不敏感 (UPPER 包装)。
    affected_carriers: [all]
    regression_targets:
      - TC-ADDR-030   # test_state_full_name
      - TC-ADDR-050   # test_all_states_abbrev_and_full
    knowledge_docs:
      - knowledge/rules/lsp_backend/address_validation.md
    status: active

  - id: CHG-001d
    module: lsp_backend
    feature: address_validation
    field: pobox_detection
    date: "2026-11-15"
    type: rule_change
    description: |
      PO Box 正则大小写不敏感，覆盖 PO Box / P.O.Box /
      Post Office Box / GPO / LPO 等变体。
    affected_carriers: [all]
    regression_targets:
      - TC-ADDR-022   # test_pobox_positive_variants
      - TC-ADDR-023   # test_pobox_negative_variants
      - TC-ADDR-024   # test_pobox_case_variants (xfail 待解)
    gotchas: [gotcha_001]
    knowledge_docs:
      - knowledge/rules/lsp_backend/address_validation.md
      - knowledge/gotchas/gotcha_001_pobox_case.md
    status: active

  # ───────────────────────────────────────────────────────
  # CHG-002: Carrier A v1.2 → v2.0 计费规则升级
  # ───────────────────────────────────────────────────────
  - id: CHG-002
    module: lsp_quote
    feature: pricing
    field: carrier_a.volumetric_weight_coefficient
    date: "2026-11-20"
    type: carrier_version
    from_version: v1.2
    to_version: v2.0
    description: |
      体积重公式变更：系数 5000 → 4000，
      体积重计算值更大，计费更高。
    affected_carriers: [carrier_a]
    regression_targets:
      - TC-QUOTE-CARA-001
      - TC-QUOTE-CARA-015
      - TC-QUOTE-CARA-022
    knowledge_docs:
      - knowledge/rules/lsp_quote/pricing_generic.md
      - knowledge/changelog/2026-11-20_quote_carrier_a_v2.md
      - config/lsp_quote/carrier_a/v2.0.yaml
    status: active

  - id: CHG-002b
    module: lsp_quote
    feature: pricing
    field: carrier_a.remote_area_surcharge
    date: "2026-11-20"
    type: new_feature
    description: |
      v2.0 新增偏远地区附加费 flag，固定 $3.50/包裹。
    affected_carriers: [carrier_a]
    regression_targets:
      - TC-QUOTE-CARA-031
    knowledge_docs:
      - knowledge/changelog/2026-11-20_quote_carrier_a_v2.md
    status: active

# ───────────────────────────────────────────────────────
# 模块-承运商-版本 三维索引（快速查找用）
# ───────────────────────────────────────────────────────
module_registry:
  lsp_backend:
    description: 基础信息配置（地址校验、策略配置）
    carriers: [all]                 # 承运商无关
    features:
      address_validation:
        current_version: v2.1
        config_path: config/lsp_backend/address_validation.yaml
        test_path: tests/lsp_backend/address/
      strategy_config:
        current_version: v1.0
        config_path: config/lsp_backend/strategy_config.yaml
        test_path: tests/lsp_backend/strategy/

  lsp_quote:
    description: 物流计费/报价
    carriers: [carrier_a, carrier_b]
    features:
      pricing:
        current_version: carrier_a=v2.0, carrier_b=v1.0
        config_path: config/lsp_quote/
        test_path: tests/lsp_quote/pricing/

      # REQ-002 /quote/price_sync：目标为 SCP 环境真实承运商（AU.TGE.*），非 carrier_a/b 假数据
      quote_price:
        current_version: v1.1
        config_path: config/lsp_quote/
        test_path: tests/lsp_quote/quote_price/
        requirement_id: REQ-002

  lsp_booking:
    description: 物流申报/下单
    carriers: [carrier_a, carrier_b]
    features:
      declare:
        current_version: v1.0
        config_path: config/lsp_booking/
        test_path: tests/lsp_booking/declare/
