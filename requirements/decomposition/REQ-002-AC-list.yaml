          待确认: 无
          验收: |
            Given warehouse 下 2 个包裹（各自有尺寸重量）
            When  请求计费
            Then  shippingCost=Σ(每包裹独立计费结果)，每包裹按自身箱规/称重选段；多包裹合计每步保留三位
    - 场景: S12
      名称: 称重档位（首重/续重分界）
