    - 场景: S14
      名称: 包裹层 0 多 SKU 组包
      原子能力:
        - id: AC-16
          名称: 组包规则（长=max/宽=max/高=累加/重=累加/三维降序重排）
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: R-050(累加基数未确认——按 SKU 明细行还是按 qty 折算，§4 重量 2.3=2×1.15 暗示按 qty 折算)
          验收: |
            Given 包裹层为 0、同一包裹含多个 SKU（或同 SKU qty>1）
            When  请求计费
            Then  组包后箱规=三维降序重排(max长, max宽, Σ高)+Σ重（累加基数【待确认 R-050】），按最终箱规选价卡段计费；结果可由规则手工复算核对
    - 场景: S15
