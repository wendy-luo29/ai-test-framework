# REQ-002 需求功能拆分 — AC 清单
# 拆分依据: requirements/docs/REQ-002_quote_price_sync.md (V1.1, 含 4+补 回填)
# 评审记录: requirements/reviews/REQ-002-review.md (REV-REQ-002-004 + 4+补, conditional-pass)
# 待确认编号复用评审记录的 R-xxx / 存量 Q-xxx 编号，不新造编号，保证可追溯。

requirement_id: REQ-002
需求名称: 承运商运费计算同步接口（POST /quote/price_sync）
模块: lsp_quote
功能域: quote_price
接口版本: v1.1
拆分日期: 2026-11-19

业务对象: [计费任务(QuoteTask), 报价结果(QuotePriceSyncVo), 承运商/价卡/zone 主数据]
核心角色: [调用方(ERP 下单/运费试算), 计费服务(被测接口), 承运商询价(第三方), SCP/WMS/ERP(推送目标, 接口级不覆盖)]

主流程:
  1. 接收订单+发件仓+包裹/SKU 明细，requestId+orderCode 幂等判断（重复直接返回上次结果）
  2. 解析承运商范围（carrierStrategyCode 策略 / carrierIds 指定，二者不能同空）
  3. 逐承运商逐仓计算运费（箱规校验 → 组包/发运重 → zone 映射 → 价卡公式 fee×(1+fuel_rate)）
  4. 两层择优（承运商内部 calcMode 择优 isBest=2 → 全局最低 isBest=1）
  5. 返回报价数组（requestId/orderCode 回显 + isBest 标记 + 排序）

范围边界:
  不覆盖:
    - 推送真实链路（isPushWms=true → SCP/WMS/ERP 实际推送）
    - bookingOrderId 申报运费计费分支（仅业务流程链路触发）
    - 限流/并发/重试（需求声明不考虑）
  依赖:
    - lsp_scp 真实主数据: 仓库 BG03、承运商 CAR2025062611067266788(AU.TGE.PRIORITY.PRO) / CAR1772558358570467346(AU.TGE.PRIORITY)、价卡 lsp_carrier_rate、zone lsp_carrier_zone
    - 金额断言一律用验证 SQL 现算现比（fee×(1+fuel_rate) 保留三位），禁止复制 §5 示例值做静态 golden（评审 4+补 断言口径）

场景与原子能力:

  M1_请求接入与幂等:
    - 场景: S01
      名称: 主流程合法请求返回报价
      原子能力:
        - id: AC-01
          名称: 合法完整请求主流程成功
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无
          验收: |
            Given 有效主数据（BG03 仓库、真实承运商、可用价卡）
            When  POST /quote/price_sync 携带完整必填字段（ownerId/orderCode/shipTo/warehouse/packages/items）与 carrierIds
            Then  L1 HTTP 200；L2 requestId/orderCode 回显、code/msg/success=true、data 为数组且每行含 §3.2 全部字段且类型正确；L3 每承运商一条内部最优行，金额=round(fee×(1+fuel_rate),3)（SQL 现算）
        - id: AC-02
          名称: 响应契约——回显、排序、行级唯一键
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无
          验收: |
            Given 一次多承运商成功计费
            When  检查响应包装与 data 数组
            Then  requestId/orderCode 与入参一致；排序 isBest=1 行优先、其余按 shippingCost 升序；同一 requestId+orderCode 包装内 bookingCarrierId+calcMode 无重复行
    - 场景: S02
      名称: 幂等重放
      原子能力:
        - id: AC-03
          名称: 相同 requestId+orderCode 重复请求返回上次结果
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: R-034(重复请求响应的 code/msg 形态未在 §6 落地)
          验收: |
            Given 同一 requestId+orderCode 已成功计费过一次
            When  以完全相同 requestId+orderCode 再次请求
            Then  不重新计费：返回与首次一致的结果（数据落库无新计费任务），无重复推送副作用
        - id: AC-04
          名称: 不同 requestId 同 orderCode 视为新请求
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无
          验收: |
            Given 某订单已用 requestId=X 计费成功
            When  用 requestId=Y + 相同 orderCode 请求
            Then  触发新计费（联合键不同=新请求），返回新生成结果
    - 场景: S03
      名称: 必填字段缺失
      原子能力:
        - id: AC-05
          名称: 必填字段缺失被拒绝（ownerId/orderCode/shipTo/warehouse 分别缺失）
          优先级: P2
          可自动化: 是
          依赖: []
          待确认: R-002(错误码表无 4xx、message 全空，缺失场景预期 code/msg 未定义)
          验收: |
            Given 合法请求
            When  分别去掉 ownerId / orderCode / shipTo / warehouse 提交
            Then  返回参数校验失败（具体 code/msg【待确认 R-002】），不产生计费任务
    - 场景: S04
      名称: requestId 未传
      原子能力:
        - id: AC-06
          名称: 不传 requestId 的行为
          优先级: P2
          可自动化: 是
          依赖: []
          待确认: R-049(未传时幂等与回显口径未定义，推定视为新请求直接计算)
          验收: |
            Given 合法请求但省略 requestId
            When  提交
            Then  【待确认 R-049】推定：视为新请求直接计算并返回；响应 requestId 回显口径待后端明确
    - 场景: S05
      名称: 字段长度边界
      原子能力:
        - id: AC-07
          名称: 字符串字段长度上界通过/超界拒绝
          优先级: P2
          可自动化: 是
          依赖: []
          待确认: R-002(超长拒绝的 code/msg 未定义)
          验收: |
            Given 合法请求
            When  requestId=64 字符 / orderCode=32 字符 / suburb=255 字符 等恰好上界值提交 → 应成功；
                  各字段超界 1 字符提交 → 拒绝（预期 code/msg【待确认 R-002】）
            Then  边界内不因长度误拒，超界有明确错误
    - 场景: S06
      名称: isPushWms / pushResultTo 组合
      原子能力:
        - id: AC-08
          名称: 推送参数组合校验（不验证真实推送）
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: R-043(isPushWms 默认值、true+pushResultTo=0 组合、默认 100 与直调传 0 关系均未定义)
          验收: |
            Given 合法请求
            When  组合提交 isPushWms(true/false/缺省) × pushResultTo(0/100/缺省)
            Then  组合校验口径【待确认 R-043】；接口级不验证 SCP/WMS/ERP 真实推送结果
