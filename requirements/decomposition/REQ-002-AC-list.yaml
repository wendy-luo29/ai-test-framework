需求名称: 承运商运费计算同步接口（POST /quote/price_sync）
模块: lsp_quote
功能域: quote_price
接口版本: v1.6
拆分日期: 2026-11-23

业务对象: [计费任务(QuoteTask), 报价结果(QuotePriceSyncVo), 承运商/策略/价卡/zone 主数据]
核心角色: [调用方(ERP 下单/运费试算), 计费服务(被测接口), 承运商询价(第三方), SCP/WMS/ERP(推送目标, 接口级不覆盖)]

主流程:
  1. 接收订单 + 单个发件仓 + 包裹/SKU 明细（本接口不做幂等，每次调用重新计算并生成新计费任务）
  2. 按 carrierStrategyCode 选承运商（策略编码如 quote_price / VIR|carrierId|carrierId）；carrierIds 接口层不使用
  3. 逐承运商计算：单包裹箱规校验 → 一票一件/一票多件 → zone 映射 → fee 按重量段取值 → fee×(1+fuel_rate)，每步四舍五入保留三位
  4. 两层择优（承运商内部 isBest=2 → 全局最低 isBest=1，恰 1 行）
  5. 过滤无价卡/不可承运/超箱规的新增承运商，返回报价数组（响应不含 requestId/orderCode，按入参查库；data 排序）

范围边界:
  不覆盖:
    - 幂等与重复请求复用结果（本接口明确不做幂等）
    - 多仓（warehouse 固定 1 个）
    - PO Box / 澳邮过滤（仅透传 closePoboxCheck，不参与计费与过滤）
    - 鉴权（不经网关、不返回 401）
    - carrierIds 作为选承运商依据（deprecated，仅兼容保留）
    - 推送真实链路（isPushWms=100 → SCP/WMS/ERP 实际推送）
    - bookingOrderId 申报运费计费分支（仅业务流程链路触发）
    - 限流/并发/重试
  依赖:
    - lsp_scp 真实主数据: 仓库 BG03、承运商 CAR2025062611067266788(AU.TGE.PRIORITY.PRO) / CAR1772558358570467346(AU.TGE.PRIORITY)、策略表 lsp_carrier_strategy / lsp_carrier_strategy_refs、价卡 lsp_carrier_rate、zone lsp_carrier_zone
    - 金额断言一律用验证 SQL 现算现比（fee×(1+fuel_rate) 每步保留三位），禁止复制 §5 示例值做静态 golden

