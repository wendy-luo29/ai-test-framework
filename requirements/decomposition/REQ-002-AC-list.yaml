          验收: |
            Given 单包裹单 SKU、包裹层尺寸/重量有值（如 §4 示例）
            When  请求计费
            Then  calcMode=1；称重向上取整选价卡段；shippingCost=round(fee×(1+fuel_rate),3)，fee/fuel_rate 由 SQL 按实查 zone 段取
    - 场景: S13
