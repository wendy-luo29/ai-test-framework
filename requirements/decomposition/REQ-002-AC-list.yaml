            When  请求计费
            Then  HTTP 500；code="500" 且 msg 非空；lsp_quote_task 落 status=300 失败行
    - 场景: S16
      名称: 金额精度
      原子能力:
        - id: AC-26
          名称: 每一步计算四舍五入保留三位小数
          优先级: P2
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无
          验收: |
            Given 构造 fee×(1+fuel_rate) 产生超过三位小数的价卡组合
            When  请求计费
            Then  单包裹运费、续重、燃油后金额、多包裹合计每步均为三位小数，shippingCost 等于逐步 round 后的公式值
  M4_两层择优:
    - 场景: S17
      名称: 承运商内部择优
      原子能力:
        - id: AC-27
          名称: calcMode=1/2 取低者为内部最优 isBest=2
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据, 多包裹/多 SKU 夹具(使两种 calcMode 结果不同), 验证SQL]
          待确认: 无
          验收: |
            Given 老承运商构造一票一件与一票多件金额不同的包裹组合
            When  请求计费
            Then  该承运商仅一条内部最优行，金额=两种 calcMode 较低者；新增承运商仅返回 calcMode=1 行
    - 场景: S18
      名称: 全局择优
      原子能力:
        - id: AC-28
          名称: 全局最低标记 isBest=1 且唯一
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无
          验收: |
            Given 多承运商各自内部最优金额不同
            When  请求计费
            Then  data 中 isBest=1 恰一行、为全局最低 shippingCost；其余行 isBest=2
    - 场景: S19
      名称: canShipping=false 与新增承运商计算方式
      原子能力:
        - id: AC-29
          名称: canShipping=false 不进响应；新增承运商行 calcMode=1
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无（canShipping=false 仅落 job_log.result_data，不做断言）
          验收: |
            Given 某承运商一票多件结果不可承运（canShipping=false）、一票一件正常
            When  请求计费
            Then  响应中该承运商仅一条 calcMode=1 行且 canShipping=true；新增承运商行 calcMode 恒为 1；canShipping=false 行不出现
    - 场景: S20
      名称: 并列金额
      原子能力:
        - id: AC-48
          名称: shippingCost 并列时按稳定排序取第一条为 isBest=1
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无
          验收: |
            Given 两个承运商内部最优 shippingCost 完全相同
            When  请求计费
            Then  isBest=1 仍恰一行，取排序（isBest=1 优先、其余 shippingCost 升序，同金额按承运商计算顺序）第一条；排序稳定可重复
  M5_异常与容错:
    - 场景: S21
      名称: 无价卡
      原子能力:
        - id: AC-30
          名称: 多承运商场景无价卡承运商被过滤，其余正常比价
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无
          验收: |
            Given 多个承运商参与，其中 1 个无有效价卡
            When  请求计费
            Then  data 无该承运商行（整体不出现），其他承运商正常返回并择优；不报整单错误
        - id: AC-51
          名称: 仅 1 个承运商且无价卡时计费失败
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无
          验收: |
            Given 仅 1 个承运商参与且无有效价卡
            When  请求计费
            Then  HTTP 500；code="500" 且 msg 非空；lsp_quote_task 落 status=300，job_log.failed_reason 记录无价卡
        - id: AC-52
          名称: 过滤后无任何可用承运商时计费失败
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据]
          待确认: 无
          验收: |
            Given 多承运商参与但全部无有效价卡
            When  请求计费
            Then  HTTP 500；code="500" 且 msg 非空；lsp_quote_task 落 status=300 失败行
    - 场景: S22
      名称: 承运商计费超时
      原子能力:
        - id: AC-31
          名称: 任一承运商超时整单报错
          优先级: P2
          可自动化: 是
          依赖: [故障注入/Mock(承运商询价超时)]
          待确认: 无（超时固定 30s，以本需求为准）
          验收: |
            Given 多个承运商参与，其中 1 个询价超过 30s
            When  请求计费
            Then  整单失败 HTTP 500；code="500" 且 msg 非空；不返回部分结果；lsp_quote_task 落 status=300
    - 场景: S23
      名称: 仓库主数据缺失
      原子能力:
        - id: AC-32
          名称: warehouseCode 不存在按计费失败处理
          优先级: P2
          可自动化: 是
          依赖: []
          待确认: 无
          验收: |
            Given warehouseCode 传不存在的编码
            When  请求计费
            Then  按计费失败返回 HTTP 500 + code="500" + msg 非空；lsp_quote_task 落 status=300 失败行，job_log.failed_reason 非空
    - 场景: S24
      名称: 失败响应统一契约
      原子能力:
        - id: AC-44
          名称: 失败统一 HTTP 500 + code="500" + 非空 msg + data=null
          优先级: P1
          可自动化: 是
          依赖: []
          待确认: 无
          验收: |
            Given 任一失败触发条件（参数校验/策略非法/计算失败/超时/无价卡/未知仓库）
            When  请求计费
            Then  code="500"；success=false；data=null；msg 非空（不校验具体文案）；响应不含 requestId/orderCode（查库校验落库值）；HTTP 状态码视为传输层，不强制 500
    - 场景: S25
      名称: 不做幂等
      原子能力:
        - id: AC-45
          名称: 相同 requestId+orderCode 重复调用生成新计费任务
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无（本接口明确不做幂等）
          验收: |
            Given 同一 requestId+orderCode 已成功计费
            When  以完全相同参数再次调用
            Then  重新计算并返回新结果；lsp_quote_task 新增 1 行（同 request_id+order_code 共 2 行），不复用上次结果
  M6_落库契约:
    - 场景: S26
      名称: 成功路径落库
      原子能力:
        - id: AC-49
          名称: 成功路径必断落库字段
          优先级: P0
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无
          验收: |
            Given 一次成功计费（requestId/orderCode 唯一）
            When  查询 lsp_quote_task / address / package / package_sku / job_log
            Then  lsp_quote_task 1 行 status=200、predict_price>0、predict_carrier_code 非空、predict_calc_mode∈{1,2}；
                  address 恰 2 行（type=100 发件 postcode=仓库、type=200 收件 postcode=派件）；
                  package 行数=请求包裹数（包裹层有值）；package_sku 行数=请求 SKU 明细行数；
                  job_log action=calc 至少 1 行；cube/cubeWeight 与 package_code 为系统生成，不校验
    - 场景: S27
      名称: 失败路径落库
      原子能力:
        - id: AC-50
          名称: 失败落库口径（计算失败落行、参数校验不落行）
          优先级: P1
          可自动化: 是
          依赖: [验证SQL]
          待确认: 无
          验收: |
            Given 分别触发计算失败（无价卡/未知仓库/超时）与参数校验拒绝（HTTP 500 进入计费前拦截）
            When  查询 lsp_quote_task / job_log
            Then  计算失败落 1 行 status=300、predict_price=0、predict_carrier_code 空；参数校验拒绝该 request_id 任务总数为 0；job_log 仅软断言（记录不判失败）

retired_atomic_capabilities:
  # V1.1 阶段已拆分、V1.3~V1.6 明确移出范围的 AC，编号保留不复用
  - id: AC-03
    原名称: 相同 requestId+orderCode 重复请求返回上次结果
    废弃原因: V1.4 起明确本接口不做幂等，每次调用重新计算
  - id: AC-04
    原名称: 不同 requestId 同 orderCode 视为新请求
    废弃原因: 同 AC-03，不做幂等后无「新/旧请求」区分语义
  - id: AC-09
    原名称: carrierIds 指定多承运商
    废弃原因: 接口层只认 carrierStrategyCode，carrierIds 仅兼容保留
  - id: AC-13
    原名称: carrierIds 含不存在的承运商 ID
    废弃原因: carrierIds 不参与选承运商；VIR 中 carrierId 不存在改由 AC-39 覆盖
  - id: AC-24
    原名称: closePoboxCheck=200 邮筒地址只走澳邮
    废弃原因: PO Box / 澳邮过滤移出本接口，仅透传（见 AC-47）
  - id: AC-25
    原名称: closePoboxCheck=100 或缺省不拦截邮筒地址
    废弃原因: 同 AC-24
  - id: AC-33
    原名称: 多仓成功场景计费与结果结构
    废弃原因: 本接口单仓，warehouse 固定 1 个
  - id: AC-34
    原名称: 多仓一仓失败整单失败
    废弃原因: 同 AC-33
  - id: AC-35
    原名称: 无 Token / 无效 Token 被拒绝
    废弃原因: 本接口不经网关、不鉴权，不返回 401

