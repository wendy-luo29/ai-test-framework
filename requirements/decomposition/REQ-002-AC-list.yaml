    - 场景: S10
      名称: 包裹层为 0 多 SKU 组包
      原子能力:
        - id: AC-16
          名称: 组包规则（长=max/宽=max/高=累加/重=累加/三维降序重排）
          优先级: P1
          可自动化: 是
          依赖: [lsp_scp 主数据, 验证SQL]
          待确认: 无（qty>1 按 qty 个相同 SKU 参与组包已在 V1.6 明确）
          验收: |
            Given 包裹层全 0、同一包裹含多个 SKU（或同 SKU qty>1）
            When  请求计费
            Then  qty>1 先按 qty 个相同 SKU 展开；组包后箱规=三维降序重排(max长, max宽, Σ高)+Σ重，按最终箱规选价卡段计费；结果可由规则手工复算
    - 场景: S11
      名称: 多包裹计费
