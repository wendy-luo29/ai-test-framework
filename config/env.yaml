# Runtime configuration for the test suite.
# Rule: no URL, account, password, or timeout may be hardcoded in test code.
#
# Empty UI/API base URLs -> the bundled local demo server in conftest.py.
# Non-empty -> the whole API layer targets that environment; set back to ""
# for an offline regression run.

ui_base_url: ""

# LSP test gateway (source: D:\AI\计费测试需求\模块一_路线择优（寻仓）.md).
# POST /address/validate resolves to:
#   http://192.168.1.162:11000/lsp/address/validate
api_base_url: "http://192.168.1.162:11000/lsp"

# Request timeout in seconds, applied by BaseApiClient to every call.
api_timeout: 10

credentials:
  username: ""
  password: ""

# ---------------------------------------------------------------------------
# 06_地址校验 (POST /address/validate)
# The source OpenAPI document defines no `servers`, no `required` fields and no
# `code` enum. The block below is the test baseline for the 3rd assertion layer:
# adjust a value here instead of editing test code.
# ---------------------------------------------------------------------------
address_validation:
  # Route appended to api_base_url; OpenAPI declares it as /address/validate.
  path: "/address/validate"
  # Applied when country is missing or empty.
  default_country: "Australia"

  expected:
    # Layer 1 -- 200/404 are the only statuses declared by the contract.
    # client_error is a test baseline for rejected requests (e.g. malformed body).
    http_status:
      ok: 200
      not_found: 404
      client_error: 400

    # Layer 3 -- RestResult envelope code/msg (baseline, pending dev sign-off).
    # A failed address validation is still a handled business result, so it is
    # expected to return code=success with data.success=false.
    code:
      success: "200"
      param_error: "400"
      system_error: "500"
    msg:
      success: "success"
      param_error: "待确认"
      system_error: "待确认"
