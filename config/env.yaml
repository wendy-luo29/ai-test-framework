# Runtime configuration for the test suite.
# Rule: no URL, account, password, or timeout may be hardcoded in test code.
#
# Empty UI/API base URLs -> the bundled local demo server in conftest.py.
# Non-empty -> the whole API layer targets that environment; set back to ""
# for an offline regression run.

ui_base_url: ""

# LSP test gateway (source: D:\AI\计费测试需求\模块一_路线择优（寻仓）.md).
# POST /address/validate resolves to:
#   http://192.168.1.162:11000/lsp/address/validate
api_base_url: "http://192.168.1.71:13109"

# Request timeout in seconds, applied by BaseApiClient to every call.
api_timeout: 30

credentials:
  username: ""
  password: ""

# ---------------------------------------------------------------------------
# 06_地址校验 (POST /address/validate)
# v2.1 confirmed rules:
#   - existence is state + postcode + suburb lookup in the address table
#   - not found -> HTTP 200, data.success=false, reason="address not found"
#   - address/address2 are only used for PO Box detection (not required)
#   - state accepts full name or abbreviation; full name is normalised
#   - DB timeout -> error response (never success=true)
#   - no auth required; only Australia is supported
# ---------------------------------------------------------------------------
address_validation:
  path: "/address/validate"
  default_country: "Australia"
  concurrency: 10

  # Exact business reason for a lookup miss (confirmed by business).
  reason:
    not_found: "address not found"

  expected:
    # Layer 1 -- 200 is the normal business response (including not-found).
    # client_error is a baseline for malformed requests.
    http_status:
      ok: 200
      client_error: 400
      not_found: 404

    # Envelope code/msg are not asserted by the suite until the backend
    # publishes an enum; kept here as the test baseline.
    code:
      success: "200"
      param_error: "400"
      system_error: "500"
    msg:
      success: "success"
      param_error: "待确认"
      system_error: "待确认"

# ---------------------------------------------------------------------------
# MySQL：仅供断言使用（只读）。host/user/name 任一为空 -> 数据库断言用例自动 skip。
# 密码通过 password_env 指向的环境变量注入，禁止写明文到本文件。
#   PowerShell:  $env:TEST_DB_PASSWORD = "***"
# ---------------------------------------------------------------------------
database:
  host: "192.168.1.31"
  port: 13306
  user: "Wendy"
  name: "lsp_scp"
  password_env: "TEST_DB_PASSWORD"
  charset: "utf8mb4"
  connect_timeout: 5
  read_timeout: 10
